name: BestWord checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: bestword
          POSTGRES_PASSWORD: bestword-local
          POSTGRES_DB: bestword
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U bestword -d bestword"
          --health-interval 3s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports:
          - 6389:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: "3000"
      APP_ORIGIN: http://127.0.0.1:3000
      BESTWORD_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://bestword:bestword-local@127.0.0.1:54329/bestword
      REDIS_URL: redis://127.0.0.1:6389
      LEXICON_PATH: data/lexicon.bin.gz
      BESTWORD_INTEGRATION: "1"
      BESTWORD_CROSS_BROWSER: "1"
      BESTWORD_AI_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run build
      - run: npx tsc -p tools/load/tsconfig.json
      - run: node --import tsx tools/load/observations-check.ts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start the computer opponent for real browser games
        run: npm run worker:ai > /tmp/bestword-ai.log 2>&1 &
      - run: npm run test:e2e
      - run: npm run test:load -- --scenario smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: apps/web/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-smoke-results
          path: tools/load/reports
          if-no-files-found: ignore

  lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - name: Select the recorded Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo +1.98.1 test --manifest-path tools/lexicon-builder/Cargo.toml
      - run: npm run build -w @bestword/lexicon
      - name: Rebuild the graph and compare it with the committed bytes
        run: |
          cargo +1.98.1 run --release --manifest-path tools/lexicon-builder/Cargo.toml -- data/dictionary.txt tools/lexicon-builder/target/repro.bin tools/lexicon-builder/target/repro-report.json
          cmp data/lexicon.bin tools/lexicon-builder/target/repro.bin
          node tools/lexicon-builder/finalize.mjs tools/lexicon-builder/target/repro.bin
      - name: Reproduce the AI dictionary intersections and graphs
        run: |
          LEXICON_BUILDER="$PWD/tools/lexicon-builder/target/release/bestword-lexicon-builder" node tools/lexicon-builder/prepare-ai.mjs
          git diff --exit-code -- data/easy.gaddag data/medium.gaddag data/ai/easy.txt data/ai/medium.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lexicon-audit-and-benchmark
          path: data/lexicon-manifest.json

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment schemas and resource references
        run: |
          python -m pip install PyYAML==6.0.2 jsonschema==4.25.1
          python deployment/validate.py
      - name: Validate Compose and build the production image
        run: |
          docker compose config --quiet
          docker compose build api
      - name: Start the complete PostgreSQL 18 and Valkey 8 environment
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/health/ready
          curl --fail http://localhost:3000/api/session
          docker compose exec -T api node -e "if(process.getuid()===0)process.exit(1)"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the job's disposable containers
        if: always()
        run: docker compose down
